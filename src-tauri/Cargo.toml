[package]
name = "eeaao_desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2.2", default-features = false, features = ["wry"] }
tauri-plugin-dialog = "2.2"
tauri-plugin-fs = "2.2"
tauri-plugin-opener = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eeaao_core = { path = "../crates/eeaao_core" }
stage3_pacs = { path = "../crates/stage3_pacs" }

[build-dependencies]
tauri-build = { version = "2.2", default-features = false }
